# Kids Mode walk-through for CI. Every step is optional so one missing
# element does not stop the run; a screenshot follows each step.
appId: com.WahegurooNetwork.SundarGutka
---
- launchApp:
    clearState: true
    permissions:
      all: allow

# First launch: the bani length chooser (BaniLengthSelector) appears
# because baniLength is "" in a fresh store.
- extendedWaitUntil:
    visible: "Short"
    timeout: 90000
    optional: true
- takeScreenshot: 00-first-run
- tapOn:
    text: "Short"
    optional: true
- tapOn:
    text: "Allow"
    optional: true

- extendedWaitUntil:
    visible: "Open settings"
    timeout: 60000
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 01-home

# App settings: turn on Kids Mode and online pronunciation checking.
- tapOn:
    text: "Open settings"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- scrollUntilVisible:
    element:
      text: "Kids Mode switch"
    direction: DOWN
    timeout: 40000
    centerElement: true
    optional: true
- tapOn:
    text: "Kids Mode switch"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- scrollUntilVisible:
    element:
      text: "Check pronunciation online switch"
    direction: DOWN
    timeout: 15000
    centerElement: true
    optional: true
- tapOn:
    text: "Check pronunciation online switch"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    text: "Check pronunciation online"
    optional: true
- takeScreenshot: 02-settings

- back
- extendedWaitUntil:
    visible: "Kids Mode"
    timeout: 15000
    optional: true
- takeScreenshot: 03-home-kids-icon

# Kids Mode: a fresh experience opens on the explorer chooser.
- tapOn:
    text: "Kids Mode"
    optional: true
- extendedWaitUntil:
    visible: "A friend for your journey"
    timeout: 30000
    optional: true
- assertVisible:
    text: "Choose your explorer"
    optional: true
- takeScreenshot: 04-character

- tapOn:
    text: "Prem Singh"
    optional: true
- tapOn:
    text: "Begin my journey"
    optional: true
- extendedWaitUntil:
    visible: "Your bani journey"
    timeout: 15000
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 05-world

- tapOn:
    text: "Explore Japji Sahib"
    optional: true
- extendedWaitUntil:
    visible: "One path through Japji Sahib"
    timeout: 15000
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 06-map

- tapOn:
    text: "Pauri 1,.*"
    optional: true
- extendedWaitUntil:
    visible: "Listen and practice one line at a time"
    timeout: 15000
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 07-pauri

- tapOn:
    text: "Practice"
    optional: true
- extendedWaitUntil:
    visible: "Listen and repeat"
    timeout: 15000
    optional: true
- tapOn:
    text: "Listen"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 08-practice
- tapOn:
    text: "Pause"
    optional: true
- tapOn:
    text: "Back"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 08b-back-to-pauri

- tapOn:
    text: "Challenge"
    optional: true
- extendedWaitUntil:
    visible: "Say each line out loud. We will listen."
    timeout: 15000
    optional: true
- takeScreenshot: 09a-ready
- tapOn:
    text: "Begin challenge"
    optional: true
- tapOn:
    text: "While using the app"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 09-challenge
- tapOn:
    text: "Leave challenge"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 09b-after-leave

# Kids settings: reachable from the header of any non-tab screen.
- tapOn:
    text: "Settings"
    optional: true
- extendedWaitUntil:
    visible: "Night mode"
    timeout: 15000
    optional: true
- scrollUntilVisible:
    element:
      text: "Night mode"
    direction: DOWN
    timeout: 10000
    centerElement: true
    optional: true
- takeScreenshot: 10a-kids-settings
# Two matches: the row title, then the Switch (accessibilityLabel "Night mode").
- tapOn:
    text: "Night mode"
    index: 1
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 10-night
- tapOn:
    text: "Back"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 11-night-after-back

# Back out of Kids Mode to the main app.
- back
- back
- back
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 12-exit
